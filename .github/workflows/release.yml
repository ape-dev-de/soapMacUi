name: Release

# Zwei Jobs mit Absicht getrennt:
#
#   build     ist schnell und vorhersagbar. Er erzeugt das signierte Artefakt
#             und legt es ab. Was hier durchläuft, ist gerettet.
#   notarize  hängt von Apples Dienst ab und ist damit der unzuverlässige
#             Teil. Scheitert oder hängt er, bleibt das signierte Ergebnis
#             aus Job 1 erhalten und dieser Job allein lässt sich neu starten.
#
# Ohne diese Trennung nimmt ein stehender Notarisierungsschritt den fertigen
# Build mit ins Grab — und `notarytool --wait` läuft ohne Zeitlimit bis zur
# Sechs-Stunden-Grenze von GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Bauen und signieren
    runs-on: macos-14
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Wails-CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Frontend bauen
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Tests
        run: go test ./... -count=1

      - name: Universal Binary bauen
        run: $(go env GOPATH)/bin/wails build -platform darwin/universal -skipbindings

      - name: Signieren
        id: sign
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "Kein Zertifikat hinterlegt — es bleibt bei der ad-hoc-Signatur."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PW=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          codesign --force --options runtime --timestamp \
            --entitlements build/darwin/entitlements.plist \
            --sign "$SIGN_ID" build/bin/SoapMacUi.app
          codesign --verify --strict --verbose=2 build/bin/SoapMacUi.app
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Signiertes Artefakt ablegen
        id: pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "$VERSION" ] && [ "$VERSION" != "$GITHUB_REF_NAME" ] || VERSION="dev"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ditto -c -k --keepParent build/bin/SoapMacUi.app "signed.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: signed-app
          path: signed.zip
          retention-days: 7

  notarize:
    name: Notarisieren und veröffentlichen
    needs: build
    runs-on: macos-14
    # Harte Obergrenze: lieber ein klarer Fehlschlag als sechs Stunden Leerlauf.
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-app

      - name: Entpacken
        run: |
          ditto -x -k signed.zip .
          codesign --verify --strict --verbose=2 SoapMacUi.app

      - name: Notarisieren
        id: notarize
        if: needs.build.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "Zugangsdaten fehlen — Notarisierung übersprungen."
            echo "stapled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --timeout begrenzt das Warten. Ohne das läuft notarytool endlos,
          # wenn Apples Dienst nicht antwortet.
          set +e
          OUT="$(xcrun notarytool submit signed.zip \
                  --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                  --password "$APPLE_APP_PASSWORD" \
                  --timeout 25m --wait 2>&1)"
          RC=$?
          set -e
          echo "$OUT"

          ID="$(sed -nE 's/^ *id: ([0-9a-f-]{36})$/\1/p' <<<"$OUT" | head -1)"
          if [ "$RC" -ne 0 ] || ! grep -q "status: Accepted" <<<"$OUT"; then
            echo "::error::Notarisierung nicht erfolgreich (exit $RC)."
            if [ -n "$ID" ]; then
              echo "--- Protokoll von Apple ---"
              xcrun notarytool log "$ID" \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD" || true
            fi
            exit 1
          fi

          xcrun stapler staple SoapMacUi.app
          xcrun stapler validate SoapMacUi.app
          spctl -a -vvv -t exec SoapMacUi.app || true
          echo "stapled=true" >> "$GITHUB_OUTPUT"

      - name: Artefakt packen
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          NAME="SoapMacUi-$VERSION-macos-universal.zip"
          ditto -c -k --keepParent SoapMacUi.app "$NAME"
          shasum -a 256 "$NAME" > "$NAME.sha256"
          ls -lh SoapMacUi-*.zip*

      - uses: actions/upload-artifact@v4
        with:
          name: SoapMacUi-macos-universal
          path: SoapMacUi-*.zip*

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SoapMacUi-*.zip
            SoapMacUi-*.zip.sha256
          generate_release_notes: true
          body: |
            Universal Binary für Apple Silicon und Intel.

            Prüfsumme siehe beigelegte `.sha256`-Datei.

            ${{ steps.notarize.outputs.stapled == 'true'
                && 'Signiert und notarisiert — startet per Doppelklick.'
                || 'Nicht notarisiert: einmalig über Rechtsklick → Öffnen bestätigen.' }}
