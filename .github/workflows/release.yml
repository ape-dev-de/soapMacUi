name: Release

# Ausgelöst durch einen Tag wie v0.1.0. Ohne die Signatur-Secrets läuft der
# Build trotzdem durch — dann eben mit ad-hoc-Signatur statt notarisiert.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Wails-CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Frontend bauen
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Tests
        run: go test ./... -count=1

      - name: Universal Binary bauen
        run: $(go env GOPATH)/bin/wails build -platform darwin/universal -skipbindings

      - name: Signieren
        id: sign
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "Kein Zertifikat hinterlegt — es bleibt bei der ad-hoc-Signatur."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PW=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          codesign --force --options runtime --timestamp \
            --entitlements build/darwin/entitlements.plist \
            --sign "$SIGN_ID" build/bin/SoapMacUi.app
          codesign --verify --strict --verbose=2 build/bin/SoapMacUi.app
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Notarisieren und stapeln
        if: steps.sign.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # Schritt-env steht im if desselben Schritts nicht zur Verfügung,
          # deshalb wird hier geprüft statt in der Bedingung.
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "Notarisierungs-Zugangsdaten fehlen — Schritt wird übersprungen."
            exit 0
          fi
          ditto -c -k --keepParent build/bin/SoapMacUi.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple build/bin/SoapMacUi.app
          xcrun stapler validate build/bin/SoapMacUi.app

      - name: Artefakt packen
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -n "$VERSION" ] || VERSION="dev"
          ditto -c -k --keepParent build/bin/SoapMacUi.app "SoapMacUi-$VERSION-macos-universal.zip"
          shasum -a 256 "SoapMacUi-$VERSION-macos-universal.zip" \
            > "SoapMacUi-$VERSION-macos-universal.zip.sha256"
          ls -lh SoapMacUi-*.zip*

      - uses: actions/upload-artifact@v4
        with:
          name: SoapMacUi-macos-universal
          path: SoapMacUi-*.zip*

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SoapMacUi-*.zip
            SoapMacUi-*.zip.sha256
          generate_release_notes: true
          body: |
            Universal Binary für Apple Silicon und Intel.

            Prüfsumme siehe beigelegte `.sha256`-Datei.

            Ist das Artefakt notarisiert, startet die App per Doppelklick.
            Andernfalls einmalig über Rechtsklick → Öffnen bestätigen.
